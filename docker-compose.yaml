services:
  web-services-db:
    image: postgres
    container_name: postgres-emerald
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emerald_frontend
    restart: unless-stopped
    depends_on:
      - web-services-db
    ports:
      - 5173:5173

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emerald_backend
    restart: unless-stopped
    depends_on:
      - web-services-db
    ports:
      - 8080:8080

volumes:
  pgdata: